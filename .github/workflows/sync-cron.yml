# Scheduled sync for the deployed instance.
#
# Actions logs on a public repo are PUBLIC, so this job never prints the URL, the secret or the
# response body: curl writes the body to /dev/null and the step only fails on a non-2xx status.
# Required repository secrets: SYNC_URL (https://<your-app>/api/sync/cron) and CRON_SECRET.
# Note: GitHub disables scheduled workflows after 60 days without repository activity;
# the app shows a "stale sync" warning if that happens, and Vercel Cron runs a daily backstop.
name: Scheduled sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger sync
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Sync secrets not configured; skipping."
            exit 0
          fi
          curl -sf -o /dev/null --max-time 90 -X POST -H "Authorization: Bearer $CRON_SECRET" "$SYNC_URL"
