# Scheduled sync for the deployed instance.
#
# Actions logs on a public repo are PUBLIC, so this job never prints the URL, the secret or the
# response body: curl writes the body to /dev/null and the step only fails on a non-2xx status.
# Required repository secrets: SYNC_URL (https://<your-app>/api/sync/cron) and CRON_SECRET.
# Runs hourly at :17 (off the top of the hour, when GitHub's scheduler is busiest). GitHub can delay
# or skip scheduled runs (observed gaps of 3–4.5h); the app warns if no sync succeeded for 6 hours.
# Phase 2: a Cloudflare Worker cron trigger becomes the primary scheduler (see docs/roadmap.md).
# GitHub also disables scheduled workflows after 60 days without repository activity.
# Vercel Cron runs a daily backstop.
name: Scheduled sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger sync
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Sync secrets not configured; skipping."
            exit 0
          fi
          curl -sf -o /dev/null --max-time 290 -X POST -H "Authorization: Bearer $CRON_SECRET" "$SYNC_URL"
